services:
  - type: web
    name: wpe-url-extractor
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
envVars:
  - key: CONCURRENCY
    value: "2"
  - key: WEBKIT_FORCE_SANDBOX
    value: "0"
  - key: WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS
    value: "1"
  - key: LIBGL_ALWAYS_SOFTWARE
    value: "1"
